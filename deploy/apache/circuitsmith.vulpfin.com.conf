<VirtualHost *:80>
    ServerName circuitsmith.vulpfin.com
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/circuitsmith_http_error.log
    CustomLog ${APACHE_LOG_DIR}/circuitsmith_http_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName circuitsmith.vulpfin.com

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/vulpfin.com.pem
    SSLCertificateKeyFile /etc/apache2/ssl/vulpfin.com.key

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ProxyPass        / http://127.25.0.1:18080/ connectiontimeout=10 timeout=120
    ProxyPassReverse / http://127.25.0.1:18080/

    ErrorLog ${APACHE_LOG_DIR}/circuitsmith_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/circuitsmith_ssl_access.log combined
</VirtualHost>
</IfModule>
